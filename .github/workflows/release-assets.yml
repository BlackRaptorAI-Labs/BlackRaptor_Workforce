# Packages the five pack folders as release assets when a v* tag is pushed.
# Packaging only: no tests run here. Built from the private source; do not hand-edit.
name: release-assets
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Zip each pack
        run: |
          set -euo pipefail
          mkdir -p out
          # Each zip carries its own pack's version, read from that pack's plugin.json; the job fails if one cannot be read.
          for pack in core engineering council marketing hardware; do
            test -d "$pack"
            version="$(python3 -c 'import json, re, sys; v = json.load(open(sys.argv[1]))["version"]; assert isinstance(v, str) and re.fullmatch(r"[0-9]+[.][0-9]+[.][0-9]+", v), v; print(v)' "$pack/.claude-plugin/plugin.json")"
            zip -qr "out/${pack}-${version}.zip" "$pack"
          done
          ls -l out
      - name: Attach zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "See each pack's CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" out/*.zip --clobber
